name: Racketly CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:

  # ─── Lint & TypeCheck ──────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npx turbo run typecheck

  # ─── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racketly
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: racketly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://racketly:test_pass@localhost:5432/racketly_test

      - name: Run DB migrations (test)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://racketly:test_pass@localhost:5432/racketly_test

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://racketly:test_pass@localhost:5432/racketly_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          NODE_ENV: test

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Build all packages and services
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            services/*/dist/
            packages/*/dist/
          retention-days: 7

  # ─── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [auth-service, booking-service, tournament-service, community-service, academy-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.service
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ────────────────────────────────────────────────────────────────
  # Un solo servidor (VPS) corriendo infra/docker/docker-compose.prod.yml — build
  # desde código fuente en el propio servidor (no pull de las imágenes de ghcr;
  # el job `docker` de arriba las publica igual, por si se necesitan para debug o
  # un rollback manual, pero el compose de producción no las consume).
  #
  # Requiere estos secrets en el repo (Settings → Secrets → Actions):
  #   DEPLOY_HOST      IP o dominio del servidor
  #   DEPLOY_USER      usuario SSH (con permiso para correr docker)
  #   DEPLOY_SSH_KEY   clave privada SSH (par con la pública ya en ~/.ssh/authorized_keys del server)
  #   DEPLOY_PATH      ruta absoluta del checkout del repo en el servidor (ej. /opt/racketly)
  # Sin estos secrets configurados, este job falla — no hay servidor real todavía,
  # así que queda listo para activarse en cuanto exista.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file apps/web/.env.production.local \
              build
            # Migraciones antes de reiniciar servicios — reusa la imagen recién
            # buildeada de auth-service, que ya tiene prisma CLI + schema/.
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file apps/web/.env.production.local \
              run --rm auth-service npx prisma migrate deploy
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file apps/web/.env.production.local \
              up -d
            docker image prune -f
