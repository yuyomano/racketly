worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # ─── Rate Limiting ─────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ─── Upstream Services ─────────────────────────────────────────────────────
  upstream auth_service {
    server auth-service:3001;
  }
  upstream booking_service {
    server booking-service:3002;
  }
  upstream tournament_service {
    server tournament-service:3003;
  }
  upstream community_service {
    server community-service:3004;
  }
  upstream academy_service {
    server academy-service:3005;
  }
  upstream notification_service {
    server notification-service:3006;
  }

  # NOTA: este archivo es una PLANTILLA de referencia — hoy no está conectado al
  # docker-compose.yml (dev) real. El gateway real en uso es el Express de
  # services/api-gateway, y este nginx además enruta directo a cada microservicio
  # (bypaseando ese gateway), lo cual duplica la routing table en dos lugares.
  #
  # Para producción, el path recomendado es infra/docker/docker-compose.prod.yml +
  # infra/docker/Caddyfile (Caddy con TLS automático vía Let's Encrypt, sin pasos
  # manuales de certbot, y enrutando todo a través del api-gateway real). Este
  # nginx.conf queda como alternativa para quien prefiera nginx + certbot manual —
  # en ese caso, reemplazar las rutas de certificado de abajo por las emitidas por
  # certbot y montar los archivos en el contenedor.

  # ─── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ─── Security Headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # ─── Health Check ───────────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # ─── Auth Service ───────────────────────────────────────────────────────
    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/profile/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Booking Service ────────────────────────────────────────────────────
    location /api/clubs/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://booking_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/courts/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://booking_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/slots/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://booking_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/bookings/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://booking_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Tournament Service ─────────────────────────────────────────────────
    location /api/tournaments/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://tournament_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/matches/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://tournament_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/rankings/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://tournament_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/match-requests/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://tournament_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── WebSocket Live Scoring ─────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://tournament_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 86400;
    }

    # ─── Community Service ──────────────────────────────────────────────────
    location /api/posts/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://community_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 50m;
    }

    location /api/groups/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://community_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/gear/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://community_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/gamification/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://community_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Academy Service ────────────────────────────────────────────────────
    location /api/courses/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://academy_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/instructors/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://academy_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Notification Service ───────────────────────────────────────────────
    location /api/notifications/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://notification_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── 404 ────────────────────────────────────────────────────────────────
    location / {
      return 404 '{"success":false,"error":"Endpoint no encontrado"}';
      add_header Content-Type application/json;
    }
  }
}
